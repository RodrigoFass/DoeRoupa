<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Chat</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      background: #F0CDC3;
      font-family: 'Poppins', Arial, sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .chat-header {
      background: #d24540;
      color: #fff;
      border-radius: 32px;
      padding: 28px 54px 18px 54px;
      font-size: 2.7em;
      font-weight: 700;
      width: fit-content;
      min-width: 220px;
      max-width: 95vw;
      margin: 48px auto 32px auto;
      font-family: inherit;
      box-shadow: 0 8px 32px rgba(210,69,64,0.13), 0 2px 8px rgba(0,0,0,0.08);
      text-align: center;
      letter-spacing: 0.5px;
      display: block;
    }
    .chat-lobby-container {
      width: 100vw;
      max-width: 420px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      margin-bottom: 120px;
    }
    .chat-card {
      background: #4a6fa5;
      border-radius: 28px;
      display: flex;
      align-items: center;
      padding: 18px 24px;
      gap: 18px;
      width: 100%;
      box-shadow: 0 4px 16px rgba(0,0,0,0.10);
      cursor: pointer;
      transition: box-shadow 0.2s, transform 0.2s;
    }
    .chat-card:hover {
      box-shadow: 0 8px 32px rgba(0,0,0,0.13);
      transform: scale(1.03);
    }
    .chat-avatar {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: #fffbe9;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.3em;
      color: #d24540;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
      flex-shrink: 0;
    }
    .chat-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .chat-nome {
      font-weight: 700;
      font-size: 1.25em;
      color: #fff;
      margin-bottom: 4px;
    }
    .chat-resumo {
      font-size: 1em;
      color: #f5eadf;
      font-weight: 400;
      word-break: break-word;
    }
    .bottom-nav {
      position: fixed;
      left: 0;
      bottom: 0;
      width: 100vw;
      background: #4a6fa5;
      box-shadow: 0 -2px 8px rgba(0,0,0,0.08);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 80px;
      z-index: 100;
    }
    .bottom-nav .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1 1 0;
      height: 100%;
      color: #fff;
      font-size: 2em;
      text-decoration: none;
      font-family: 'Poppins', 'Segoe UI', Arial, sans-serif;
      font-weight: 600;
      transition: color 0.2s;
      padding: 0;
      margin: 0;
    }
    .bottom-nav .nav-item i {
      font-size: 1.5em;
      margin: 0 auto;
      display: block;
    }
    .bottom-nav .nav-item.active,
    .bottom-nav .nav-item:hover {
      color: #f8b400;
    }
    .icon-badge-container {
      position: relative;
      display: inline-block;
    }
    .badge {
      position: absolute;
      top: -6px;
      right: -10px;
      background: #d24540;
      color: #fff;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      font-size: 0.5em;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
      border: 2.5px solid #fff;
      box-shadow: 0 2px 8px rgba(210,69,64,0.18);
      transition: background 0.2s, box-shadow 0.2s;
      letter-spacing: 0;
      padding: 0;
    }
    @media (max-width: 600px) {
      .chat-header {
        font-size: 1.3em;
        padding: 14px 10vw 10px 10vw;
        margin: 18px auto 32px auto;
        min-width: 0;
        width: 90vw;
        border-radius: 22px;
      }
      .chat-lobby-container {
        max-width: 99vw;
        gap: 16px;
      }
      .chat-card {
        padding: 12px 10px;
        border-radius: 18px;
      }
      .chat-avatar {
        width: 44px;
        height: 44px;
        font-size: 1.3em;
      }
    }
    @media (max-width: 900px) {
      .chat-header {
        font-size: 1.3em;
        padding: 14px 10vw 10px 10vw;
        margin: 18px auto 32px auto;
        min-width: 0;
        width: 90vw;
        border-radius: 22px;
      }
      .chat-lobby-container {
        max-width: 99vw;
        gap: 16px;
      }
      .chat-card {
        padding: 12px 10px;
        border-radius: 18px;
      }
      .chat-avatar {
        width: 44px;
        height: 44px;
        font-size: 1.3em;
      }
    }
  </style>
</head>
<body>
  <div class="chat-header">Chat</div>
  <div class="chat-lobby-container" id="chatLobbyContainer">
    <!-- Conversas serão inseridas aqui via JS -->
  </div>
  <nav class="bottom-nav">
    <a href="home.html" class="nav-item"><i class="fas fa-home"></i></a>
    <a href="notificacoes.html" class="nav-item" id="notificacoesNav">
      <span class="icon-badge-container"><i class="fas fa-bell"></i><span class="badge" id="notificacoesBadge" style="display:none;">●</span></span>
    </a>
    <a href="agenda.html" class="nav-item"><i class="fas fa-calendar-alt"></i></a>
    <a href="chat.html" class="nav-item active"><i class="fas fa-comments"></i></a>
    <a href="configuracoes.html" class="nav-item"><i class="fas fa-cog"></i></a>
  </nav>
  <script>
    async function carregarConversas() {
      const userId = localStorage.getItem('userId');
      const userType = localStorage.getItem('userType');
      if (!userId || !userType) {
        window.location.href = '/login';
        return;
      }
      const resp = await fetch(`/conversas?id=${userId}&tipo=${userType}`);
      const conversas = await resp.json();
      const container = document.getElementById('chatLobbyContainer');
      container.innerHTML = '';
      if (!conversas.length) {
        container.innerHTML = '<div style="color:#b6a6a0;text-align:center;margin-top:32px;">Nenhuma conversa encontrada.</div>';
        return;
      }
      for (const conversa of conversas) {
        let nomeOutro = '';
        let avatarIcon = '<i class="fas fa-user"></i>';
        if (userType === 'usuario') {
          const respInst = await fetch(`/dados`);
          const dados = await respInst.json();
          const inst = dados.instituicoes.find(i => i.id === conversa.instituicao_id);
          nomeOutro = inst ? inst.nome : conversa.instituicao_id;
        } else {
          const respUser = await fetch(`/dados`);
          const dados = await respUser.json();
          const user = dados.usuarios.find(u => u.id === conversa.usuario_id);
          nomeOutro = user ? user.nome : conversa.usuario_id;
        }
        const resumo = conversa.ultima_mensagem || 'Clique para conversar';
        const card = document.createElement('div');
        card.className = 'chat-card';
        card.innerHTML = `
          <div class='chat-info'>
            <div class='chat-nome'>${nomeOutro}</div>
            <div class='chat-resumo'>${resumo}</div>
          </div>
          <div class='chat-avatar'>${avatarIcon}</div>
        `;
        card.onclick = () => { window.location.href = `conversa.html?id=${conversa.id}`; };
        container.appendChild(card);
      }
    }
    document.addEventListener('DOMContentLoaded', carregarConversas);
    function atualizarBadgeNotificacoes() {
      const badge = document.getElementById('notificacoesBadge');
      const userId = localStorage.getItem('userId');
      const userType = localStorage.getItem('userType');
      if (!userId || !userType) return;
      fetch(`/notificacoes?id=${userId}&tipo=${userType}`)
        .then(res => res.json())
        .then(notificacoes => {
          const naoLidas = notificacoes.filter(n => !n.lida);
          if (naoLidas.length > 0) {
            badge.style.display = 'flex';
            badge.textContent = naoLidas.length;
          } else {
            badge.style.display = 'none';
          }
        })
        .catch(error => {
          console.error('Erro ao verificar notificações:', error);
        });
    }
    document.addEventListener('DOMContentLoaded', atualizarBadgeNotificacoes);
    // Atualiza o badge a cada 30 segundos
    setInterval(atualizarBadgeNotificacoes, 30000);
  </script>
</body>
</html>
