<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192x192.png">
    <meta name="theme-color" content="#d24540">

    <script>
        if ('serviceWorker' in navigator) {
          window.addEventListener('load', function() {
            navigator.serviceWorker.register('/service-worker.js')
              .then(function(registration) {
                console.log('Service Worker registrado com sucesso:', registration.scope);
              })
              .catch(function(error) {
                console.log('Falha ao registrar o Service Worker:', error);
              });
          });
        }
      </script>

  <meta charset="UTF-8">
  <title>Login</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400..800&family=Figtree:ital,wght@0,300..900;1,300..900&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Lora:ital,wght@0,400..700;1,400..700&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Overlock:ital,wght@0,400;0,700;0,900;1,400;1,700;1,900&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    body {
      background: #F0CDC3;
      font-family: 'Poppins', Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #mensagemErro {
      color: #d24540;
      margin-top: 10px;
      font-weight: 600;
      display: none;
      text-align: center;
      font-size: 1.1em;
    }

    .form-container {
      max-width: 420px;
      width: 100%;
      margin: 0 auto;
      margin-top: 40px;
      padding: 36px 28px 32px 28px;
      background: #fff;
      border-radius: 28px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.10);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      margin-left: auto;
      margin-right: auto;
    }

    .logo {
      width: 260px;
      margin-bottom: 28px;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }

    .form-control,
    .form-select {
      background: #f5eadf;
      color: #4a6fa5;
      border: none;
      border-radius: 16px;
      text-align: center;
      font-size: 1.1em;
      margin-bottom: 18px;
      padding: 14px 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
      transition: box-shadow 0.2s;
    }
    .form-control:focus,
    .form-select:focus {
      background: #f5eadf;
      color: #4a6fa5;
      border: none;
      box-shadow: 0 4px 16px rgba(74,111,165,0.13);
    }

    .form-control::placeholder {
      color: #b6a6a0;
      text-align: center;
      font-size: 1em;
    }

    .btn-primary {
      background: #4a6fa5;
      border: none;
      color: #fff;
      border-radius: 16px;
      font-size: 1.15em;
      font-weight: 700;
      padding: 14px 0;
      margin-bottom: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
      transition: background 0.2s, transform 0.2s;
    }
    .btn-primary:hover {
      background: #d24540;
      color: #fff;
      transform: scale(1.03);
    }

    .btn-link {
      color: #4a6fa5;
      font-weight: 600;
      text-decoration: underline;
      font-size: 1em;
      background: none;
      border: none;
      margin-bottom: 6px;
      transition: color 0.2s;
    }
    .btn-link:hover {
      color: #d24540;
      text-decoration: underline;
    }

    .d-flex {
      justify-content: space-between;
      gap: 8px;
    }

    @media (max-width: 600px) {
      .logo { max-width: 160px; }
      .form-container {
        max-width: 98vw;
        padding: 18px 4vw 18px 4vw;
        border-radius: 18px;
      }
      .btn-primary, .form-control, .form-select { font-size: 1em; padding: 12px 0; }
    }
  </style>
</head>

<body class="d-flex align-items-center justify-content-center vh-100">

  <div class="container main">
    <center><img class="logo" src="logo.png" alt="Logo"></center>
    <div class="form-container">

      <form id="loginForm">

        <div class="mb-3">
          <select id="tipoLogin" name="tipo" class="form-select" required onchange="atualizarLabelLogin()">
            <option value="usuario">Usuário</option>
            <option value="instituicao">Instituição</option>
          </select>
        </div>

        <div class="mb-3">
          <input type="text" id="loginId" name="id" class="form-control" placeholder="Digite seu CPF" required>
        </div>

        <div class="mb-3">
          <input type="password" id="senhaLogin" name="senha" class="form-control" placeholder="Digite sua senha" required>
        </div>

        <div class="d-flex mb-3">
          <button type="button" class="btn btn-link" onclick="window.location.href='esqueci-senha.html'">Esqueci a Senha</button>
          <button type="button" class="btn btn-link" onclick="window.location.href='esqueci-usuario.html'">Esqueci o Usuário</button>
        </div>

        <div class="d-grid gap-2">
          <button type="submit" class="btn btn-primary">Login</button>
          <button type="button" class="btn btn-link" onclick="irParaCadastro()">Cadastrar</button>
        </div>

        <div id="mensagemErro" class="text-center mt-3">Usuário ou senha inválidos.</div>

      </form>

    </div>
  </div>

  <!-- Bootstrap Bundle (JS + Popper) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // Limpa dados antigos ao carregar a tela de login
    localStorage.removeItem('userType');
    localStorage.removeItem('userId');

    function atualizarLabelLogin() {
      const tipo = document.getElementById('tipoLogin').value;
      const loginId = document.getElementById('loginId');
      const senhaLogin = document.getElementById('senhaLogin');

      if (tipo === 'usuario') {
        loginId.placeholder = 'Digite seu CPF';
      } else {
        loginId.placeholder = 'Digite o CNPJ';
      }

      loginId.value = '';
      senhaLogin.value = '';
      esconderMensagemErro();
    }

    function irParaCadastro() {
      window.location.href = "cadastro.html";
    }

    document.getElementById('loginForm').addEventListener('submit', async function(event) {
      event.preventDefault(); // Impede envio automático

      const tipo = document.getElementById('tipoLogin').value;
      const id = document.getElementById('loginId').value.trim();
      const senha = document.getElementById('senhaLogin').value.trim();

      if (!id || !senha) {
        Swal.fire({
          icon: 'warning',
          title: 'Atenção',
          text: 'Por favor, preencha todos os campos!',
          confirmButtonColor: '#4a6fa5'
        });
        return;
      }

      try {
        const response = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ tipo, id, senha })
        });

        const resultado = await response.json();

        if (resultado.sucesso) {
          // Armazena as informações no localStorage
          localStorage.setItem('userId', id);
          localStorage.setItem('userType', tipo);
          
          if (tipo === 'usuario') {
            window.location.href = '/home.html';
          } else {
            window.location.href = '/home_instituicao.html';
          }
        } else {
          mostrarMensagemErro();
        }
      } catch (error) {
        console.error('Erro ao fazer login:', error);
        Swal.fire({
          icon: 'error',
          title: 'Erro',
          text: 'Erro ao fazer login. Por favor, tente novamente.',
          confirmButtonColor: '#4a6fa5'
        });
      }
    });

    function mostrarMensagemErro() {
      document.getElementById('mensagemErro').style.display = 'block';
    }

    function esconderMensagemErro() {
      document.getElementById('mensagemErro').style.display = 'none';
    }
  </script>

</body>
</html>
