<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Responsividade -->
  <title>Cadastro</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400..800&display=swap" rel="stylesheet">

  <style>
    body {
      background: #F0CDC3;
      font-family: 'Poppins', Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #mensagemErro {
      color: #d24540;
      margin-top: 10px;
      font-weight: 600;
      display: none;
      text-align: center;
      font-size: 1.1em;
    }

    .form-container {
      max-width: 420px;
      width: 100%;
      margin: 0 auto;
      margin-top: 24px;
      padding: 18px 18px 18px 18px;
      background: #fff;
      border-radius: 28px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.10);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      margin-left: auto;
      margin-right: auto;
    }

    .logo {
      width: 260px;
      margin-bottom: 28px;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }

    .form-control,
    .form-select {
      background: #f5eadf;
      color: #4a6fa5;
      border: none;
      border-radius: 16px;
      text-align: center;
      font-size: 1.05em;
      margin-bottom: 10px;
      padding: 10px 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
      transition: box-shadow 0.2s;
    }
    .form-control:focus,
    .form-select:focus {
      background: #f5eadf;
      color: #4a6fa5;
      border: none;
      box-shadow: 0 4px 16px rgba(74,111,165,0.13);
    }

    .form-control::placeholder {
      color: #b6a6a0;
      text-align: center;
      font-size: 1em;
    }

    .btn-primary {
      background: #4a6fa5;
      border: none;
      color: #fff;
      border-radius: 16px;
      font-size: 1.15em;
      font-weight: 700;
      padding: 14px 0;
      margin-bottom: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
      transition: background 0.2s, transform 0.2s;
    }
    .btn-primary:hover {
      background: #d24540;
      color: #fff;
      transform: scale(1.03);
    }

    .btn-link {
      color: #4a6fa5;
      font-weight: 600;
      text-decoration: underline;
      font-size: 1em;
      background: none;
      border: none;
      margin-bottom: 6px;
      transition: color 0.2s;
    }
    .btn-link:hover {
      color: #d24540;
      text-decoration: underline;
    }

    .d-flex {
      justify-content: space-between;
      gap: 8px;
    }

    @media (max-width: 600px) {
      .logo { max-width: 160px; }
      .form-container {
        max-width: 98vw;
        padding: 18px 4vw 18px 4vw;
        border-radius: 18px;
      }
      .btn-primary, .form-control, .form-select { font-size: 1em; padding: 12px 0; }
    }

    h1 {
      text-align: center;
      color: #d24540;
      font-family: 'Poppins', Arial, sans-serif;
      font-size: 2.6em;
      font-weight: 700;
      background: #fff4ee;
      border-radius: 24px;
      box-shadow: 0 4px 16px rgba(210,69,64,0.08);
      padding: 18px 0 14px 0;
      margin: 0 auto 28px auto;
      width: 90%;
      letter-spacing: 1px;
    }
  </style>
</head>

<body>

<div class="container d-flex flex-column align-items-center justify-content-center">
  <img class="logo" src="logo.png" alt="Logo">
  
  <div class="form-container">
    <h1>Cadastro</h1>

    <form id="cadastroForm">

      <div class="mb-3">
        <select id="tipo" name="tipo" class="form-select" required onchange="atualizarPlaceholderId()">
          <option value="usuario">Usuário</option>
          <option value="instituicao">Instituição</option>
        </select>
      </div>

      <div class="mb-3">
        <input type="text" name="id" id="campoId" class="form-control" placeholder="CPF" required>
      </div>

      <div class="mb-3">
        <input type="text" name="nome" id="nome" class="form-control" placeholder="Nome" required>
      </div>

      <div class="mb-3">
        <input type="email" name="email" id="email" class="form-control" placeholder="E-mail" required>
      </div>

      <div class="mb-3">
        <input type="text" name="telefone" id="telefone" class="form-control" placeholder="Telefone" required>
      </div>

      <div class="mb-3">
        <input type="text" name="endereco" id="endereco" class="form-control" placeholder="Endereço" required>
      </div>

      <div class="mb-3">
        <input type="password" name="senha" id="senha" class="form-control" placeholder="Senha" required>
      </div>

      <div class="mb-3">
        <input type="password" name="confirmacao" id="confirmacao" class="form-control" placeholder="Confirmação de Senha" required>
      </div>

      <div class="d-grid gap-2">
        <button type="submit" class="btn btn-primary">Cadastrar</button>
      </div>

    </form>
  </div>
</div>

<!-- Bootstrap Bundle (JS + Popper) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
  function atualizarPlaceholderId() {
    const tipo = document.getElementById('tipo').value;
    const campoId = document.getElementById('campoId');
    campoId.placeholder = tipo === 'usuario' ? 'CPF' : 'CNPJ';

    // Limpar campos
    campoId.value = '';
    document.getElementById('nome').value = '';
    document.getElementById('email').value = '';
    document.getElementById('telefone').value = '';
    document.getElementById('endereco').value = '';
    document.getElementById('senha').value = '';
    document.getElementById('confirmacao').value = '';
  }

  document.getElementById('cadastroForm').addEventListener('submit', async function (e) {
    e.preventDefault();

    const tipo = document.getElementById('tipo').value;
    const id = document.getElementById('campoId').value.trim();
    const nome = document.getElementById('nome').value.trim();
    const email = document.getElementById('email').value.trim();
    const telefone = document.getElementById('telefone').value.trim();
    const endereco = document.getElementById('endereco').value.trim();
    const senha = document.getElementById('senha').value;
    const confirmacao = document.getElementById('confirmacao').value;

    if (senha !== confirmacao) {
      Swal.fire({
        icon: 'error',
        title: 'Erro',
        text: 'As senhas não coincidem!',
        confirmButtonColor: '#4a6fa5'
      });
      return false;
    }

    if (tipo === 'usuario' && !validarCPF(id)) {
      Swal.fire({
        icon: 'error',
        title: 'Erro',
        text: 'CPF inválido!',
        confirmButtonColor: '#4a6fa5'
      });
      return false;
    }

    if (!validarEmail(email)) {
      Swal.fire({
        icon: 'error',
        title: 'Erro',
        text: 'E-mail inválido!',
        confirmButtonColor: '#4a6fa5'
      });
      return false;
    }

    const telefoneNumerico = telefone.replace(/\D/g, '');
    if (telefoneNumerico.length < 9) {
      Swal.fire({
        icon: 'error',
        title: 'Erro',
        text: 'Telefone inválido!',
        confirmButtonColor: '#4a6fa5'
      });
      return false;
    }

    // const cepNumerico = endereco.replace(/\D/g, '');
    // if (cepNumerico.length !== 8) {
    //   alert('CEP inválido!');
    //   return;
    // }

    try {
      const resposta = await fetch('/cadastrar', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ tipo, id, nome, email, senha, telefone, endereco })
      });

      const texto = await resposta.text();
      
      if (texto.includes('sucesso')) {
        Swal.fire({
          icon: 'success',
          title: 'Sucesso!',
          text: 'Cadastro realizado com sucesso!',
          confirmButtonColor: '#4a6fa5'
        }).then(() => {
          window.location.href = '/login';
        });
      } else {
        Swal.fire({
          icon: 'error',
          title: 'Erro',
          text: texto,
          confirmButtonColor: '#4a6fa5'
        });
      }
    } catch (error) {
      console.error('Erro ao tentar cadastrar:', error);
      Swal.fire({
        icon: 'error',
        title: 'Erro',
        text: 'Erro ao tentar cadastrar.',
        confirmButtonColor: '#4a6fa5'
      });
    }
  });

  function validarCPF(cpf) {
    cpf = cpf.replace(/[^\d]+/g, '');
    if (cpf.length !== 11 || /^(\d)\1+$/.test(cpf)) return false;

    let soma = 0;
    for (let i = 0; i < 9; i++) soma += parseInt(cpf.charAt(i)) * (10 - i);
    let resto = 11 - (soma % 11);
    if (resto === 10 || resto === 11) resto = 0;
    if (resto !== parseInt(cpf.charAt(9))) return false;

    soma = 0;
    for (let i = 0; i < 10; i++) soma += parseInt(cpf.charAt(i)) * (11 - i);
    resto = 11 - (soma % 11);
    if (resto === 10 || resto === 11) resto = 0;
    return resto === parseInt(cpf.charAt(10));
  }

  function validarEmail(email) {
    return /^[^\s@]+@[^\s@]+\.(com|com\.br|net|org)$/i.test(email);
  }

  function validarTelefone(telefone) {
    const telefoneNumerico = telefone.replace(/\D/g, '');
    return telefoneNumerico.length >= 9;
  }
</script>

</body>
</html>
