<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Configurações</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', Arial, sans-serif;
      background: #F0CDC3;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100vw;
      box-sizing: border-box;
    }
    .config-header {
      background: #d24540;
      color: #fff;
      border-radius: 32px;
      padding: 28px 54px 18px 54px;
      font-size: 2.7em;
      font-weight: 700;
      width: fit-content;
      min-width: 220px;
      max-width: 95vw;
      margin: 48px auto 32px auto;
      font-family: inherit;
      box-shadow: 0 8px 32px rgba(210,69,64,0.13), 0 2px 8px rgba(0,0,0,0.08);
      text-align: center;
      letter-spacing: 0.5px;
      margin-left: auto;
      margin-right: auto;
      display: block;
    }
    .config-options {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 32px;
      width: 100vw;
      max-width: 500px;
      margin-left: auto;
      margin-right: auto;
      flex: 1;
      min-height: calc(100vh - 180px); /* altura total menos header e bottom nav */
    }
    .config-btn {
      width: 90vw;
      max-width: 400px;
      padding: 26px 0;
      border: none;
      border-radius: 24px;
      font-size: 1.25em;
      font-weight: 700;
      color: #fff;
      background: #4a6fa5;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s, box-shadow 0.2s;
      font-family: inherit;
      box-shadow: 0 6px 24px rgba(0,0,0,0.10);
      margin-left: auto;
      margin-right: auto;
      display: block;
    }
    .config-btn:last-child {
      background: #d24540;
    }
    .config-btn:hover {
      filter: brightness(1.08);
      transform: scale(1.04);
      box-shadow: 0 12px 32px rgba(0,0,0,0.13);
    }
    .bottom-nav {
      position: fixed;
      left: 0;
      bottom: 0;
      width: 100vw;
      background: #4a6fa5;
      box-shadow: 0 -2px 8px rgba(0,0,0,0.08);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 80px;
      z-index: 100;
    }
    .bottom-nav .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1 1 0;
      height: 100%;
      color: #fff;
      font-size: 2em;
      text-decoration: none;
      font-family: 'Poppins', 'Segoe UI', Arial, sans-serif;
      font-weight: 600;
      transition: color 0.2s;
      padding: 0;
      margin: 0;
    }
    .bottom-nav .nav-item i {
      font-size: 1.5em;
      margin: 0 auto;
      display: block;
    }
    .bottom-nav .nav-item.active,
    .bottom-nav .nav-item:hover {
      color: #f8b400;
    }
    @media (max-width: 600px) {
      body {
        min-height: 100vh;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
      }
      .config-header {
        margin: 18px auto 24px auto;
        text-align: center;
      }
      .config-options {
        min-height: calc(100vh - 120px);
        height: calc(100vh - 120px);
        justify-content: center;
        align-items: center;
        margin-top: 0;
      }
      .config-btn {
        margin-left: auto;
        margin-right: auto;
        display: block;
      }
      html, body {
        overflow-x: hidden;
        width: 100vw;
        min-width: 0;
      }
      body {
        padding: 0;
        margin: 0;
        width: 100vw;
        min-width: 0;
      }
      .config-header {
        font-size: 1.3em;
        padding: 14px 4vw 10px 4vw;
        margin: 18px auto 24px auto;
        min-width: 0;
        width: 92vw;
        border-radius: 18px;
        box-sizing: border-box;
      }
      .config-options {
        gap: 14px;
        margin-top: 18px;
        width: 100vw;
        padding: 0 2vw;
        box-sizing: border-box;
      }
      .config-btn {
        font-size: 1.08em;
        padding: 16px 0;
        max-width: 98vw;
        width: 98vw;
        border-radius: 14px;
        margin: 0 auto;
        box-sizing: border-box;
      }
      .modal-content {
        padding: 14px 4vw;
        border-radius: 14px;
        max-width: 98vw;
        width: 96vw;
        left: 50%;
        transform: translateX(-50%);
        box-sizing: border-box;
      }
      .form-group {
        margin-bottom: 14px;
      }
      .form-control, .input-custom, .senha-input {
        font-size: 1em;
        padding: 12px 10px;
        border-radius: 12px;
        width: 100%;
        box-sizing: border-box;
      }
      .btn-salvar {
        font-size: 1em;
        padding: 12px 0;
        border-radius: 12px;
        width: 100%;
        box-sizing: border-box;
      }
      .senha-wrapper, .input-wrapper {
        padding: 0 4px 0 0;
        min-height: 40px;
        border-radius: 12px;
      }
      .bottom-nav {
        height: 70px;
        min-width: 0;
        width: 100vw;
        left: 0;
        box-sizing: border-box;
      }
      .bottom-nav .nav-item {
        font-size: 1.5em;
        min-width: 0;
      }
      .badge {
        width: 18px;
        height: 18px;
        font-size: 0.7em;
      }
    }
    @media (min-width: 900px) {
      .config-options { max-width: 700px; }
      .config-btn { max-width: 600px; }
    }
    .modal-perfil {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal-content {
      background: #fff;
      padding: 30px;
      border-radius: 24px;
      width: 90%;
      max-width: 500px;
      position: relative;
    }
    .close-modal {
      position: absolute;
      right: 20px;
      top: 15px;
      font-size: 24px;
      cursor: pointer;
      color: #d24540;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-control {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 16px;
      font-size: 1em;
      background: #f5eadf;
    }
    .btn-salvar {
      background: #4a6fa5;
      color: #fff;
      border: none;
      border-radius: 16px;
      padding: 14px 0;
      width: 100%;
      font-size: 1.15em;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-salvar:hover {
      background: #d24540;
    }
    .input-wrapper, .senha-wrapper {
      display: flex;
      align-items: center;
      background: #e9e9e9;
      border-radius: 16px;
      padding: 0 8px 0 0;
      margin-top: 2px;
      min-height: 44px;
    }
    .input-custom, .senha-input {
      flex: 1;
      border: none;
      background: transparent;
      box-shadow: none;
      font-size: 1em;
      padding: 12px 0 12px 16px;
      color: #888;
      border-radius: 16px;
    }
    .btn-olho {
      background: none;
      border: none;
      color: #4a6fa5;
      font-size: 1.3em;
      cursor: pointer;
      padding: 0 12px 0 8px;
      display: flex;
      align-items: center;
      height: 38px;
      border-radius: 50%;
      outline: none;
    }
    .btn-olho:active, .btn-olho:focus {
      outline: none;
      box-shadow: none;
    }
    .icon-badge-container {
      position: relative;
      display: inline-block;
    }
    .badge {
      position: absolute;
      top: -6px;
      right: -10px;
      background: #d24540;
      color: #fff;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      font-size: 0.5em;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
      border: 2.5px solid #fff;
      box-shadow: 0 2px 8px rgba(210,69,64,0.18);
      transition: background 0.2s, box-shadow 0.2s;
      letter-spacing: 0;
      padding: 0;
    }
  </style>
</head>
<body>
  <div class="config-header">Configurações</div>
  <div class="config-options">
    <button class="config-btn" onclick="window.location.href='perfil.html'">Perfil</button>
    <button class="config-btn" onclick="window.location.href='contato.html'">Contato</button>
    <button class="config-btn" onclick="logoutAndGoToLogin()">Sair</button>
  </div>

  <!-- Modal de Edição de Perfil -->
  <div id="modalPerfil" class="modal-perfil" style="display:none;">
    <div class="modal-content">
      <span class="close-modal" onclick="fecharModalPerfil()">&times;</span>
      <h2>Perfil</h2>
      <form id="formEditarPerfil">
        <div class="form-group">
          <label for="editNome">Nome</label>
          <div class="input-wrapper">
            <input type="text" id="editNome" class="form-control input-custom" placeholder="Nome" required disabled style="background: transparent; border:none; box-shadow:none;">
          </div>
        </div>
        <div class="form-group">
          <label for="editEmail">E-mail</label>
          <div class="input-wrapper">
            <input type="email" id="editEmail" class="form-control input-custom" placeholder="E-mail" required disabled style="background: transparent; border:none; box-shadow:none;">
          </div>
        </div>
        <div class="form-group">
          <label for="editTelefone">Telefone</label>
          <div class="input-wrapper">
            <input type="text" id="editTelefone" class="form-control input-custom" placeholder="Telefone" required disabled style="background: transparent; border:none; box-shadow:none;">
          </div>
        </div>
        <div class="form-group">
          <label for="editEndereco">Endereço</label>
          <div class="input-wrapper">
            <input type="text" id="editEndereco" class="form-control input-custom" placeholder="Endereço" required disabled style="background: transparent; border:none; box-shadow:none;">
          </div>
        </div>
        <div class="form-group">
          <label for="editSenha">Senha</label>
          <div class="senha-wrapper">
            <input type="password" id="editSenha" class="form-control senha-input" placeholder="Senha" required disabled style="background: transparent; border:none; box-shadow:none;">
            <button type="button" id="toggleSenha" class="btn-olho" tabindex="-1">
              <i class="fas fa-eye"></i>
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="home.html" class="nav-item"><i class="fas fa-home"></i></a>
    <a href="notificacoes.html" class="nav-item" id="notificacoesNav">
      <span class="icon-badge-container"><i class="fas fa-bell"></i><span class="badge" id="notificacoesBadge" style="display:none;">0</span></span>
    </a>
    <a href="agenda.html" class="nav-item"><i class="fas fa-calendar-alt"></i></a>
    <a href="chat.html" class="nav-item"><i class="fas fa-comments"></i></a>
    <a href="configuracoes.html" class="nav-item active"><i class="fas fa-cog"></i></a>
  </nav>
  <script>
    function logoutAndGoToLogin() {
      sessionStorage.clear();
      localStorage.removeItem('usuario_id');
      localStorage.removeItem('tipo');
      window.location.href = '/login.html';
    }

    async function abrirModalPerfil() {
      const tipo = sessionStorage.getItem('tipo');
      const id = sessionStorage.getItem('usuario_id');
      
      try {
        const response = await fetch('/dados');
        const dados = await response.json();
        
        const tabela = tipo === 'usuario' ? 'usuarios' : 'instituicoes';
        const perfil = dados[tabela].find(item => item.id === id);
        
        if (perfil) {
          document.getElementById('editNome').value = perfil.nome;
          document.getElementById('editEmail').value = perfil.email;
          document.getElementById('editTelefone').value = perfil.telefone;
          document.getElementById('editEndereco').value = perfil.endereco;
          document.getElementById('editSenha').value = perfil.senha;
          document.getElementById('modalPerfil').style.display = 'flex';
        }
      } catch (error) {
        console.error('Erro ao carregar dados do perfil:', error);
        Swal.fire({
          icon: 'error',
          title: 'Erro',
          text: 'Erro ao carregar dados do perfil',
          confirmButtonColor: '#4a6fa5'
        });
      }
    }

    function fecharModalPerfil() {
      document.getElementById('modalPerfil').style.display = 'none';
    }

    document.getElementById('toggleSenha').onclick = function() {
      const senhaInput = document.getElementById('editSenha');
      const icon = this.querySelector('i');
      if (senhaInput.type === 'password') {
        senhaInput.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
      } else {
        senhaInput.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
      }
    };

    // Função para verificar o tipo de usuário
    async function verificarTipoUsuario() {
      let tipo = localStorage.getItem('userType');
      let id = localStorage.getItem('userId');
      if (!id) {
        Swal.fire({
          icon: 'warning',
          title: 'Atenção',
          text: 'Por favor, faça login para continuar',
          confirmButtonColor: '#4a6fa5'
        }).then(() => {
          window.location.href = '/login';
        });
        return;
      }
      if (!tipo) {
        try {
          const response = await fetch(`/verificar-tipo?id=${id}`);
          const data = await response.json();
          if (!data.tipo) {
            Swal.fire({
              icon: 'warning',
              title: 'Atenção',
              text: 'Por favor, faça login para continuar',
              confirmButtonColor: '#4a6fa5'
            }).then(() => {
              window.location.href = '/login';
            });
            return;
          }
          localStorage.setItem('userType', data.tipo);
        } catch (error) {
          console.error('Erro ao verificar tipo de usuário:', error);
          Swal.fire({
            icon: 'error',
            title: 'Erro',
            text: 'Erro ao verificar tipo de usuário',
            confirmButtonColor: '#4a6fa5'
          }).then(() => {
            window.location.href = '/login';
          });
        }
      }
    }

    // Verifica o tipo de usuário quando a página carrega
    document.addEventListener('DOMContentLoaded', verificarTipoUsuario);

    // Adiciona evento de clique para o botão home
    document.querySelector('a[href="home.html"]').addEventListener('click', function(e) {
      e.preventDefault();
      const userType = localStorage.getItem('userType');
      if (userType === 'instituicao') {
        window.location.href = '/home_instituicao.html';
      } else {
        window.location.href = '/home.html';
      }
    });

    function atualizarBadgeNotificacoes() {
      const badge = document.getElementById('notificacoesBadge');
      const userId = localStorage.getItem('userId');
      const userType = localStorage.getItem('userType');
      if (!userId || !userType) return;
      fetch(`/notificacoes?id=${userId}&tipo=${userType}`)
        .then(res => res.json())
        .then(notificacoes => {
          const naoLidas = notificacoes.filter(n => !n.lida);
          if (naoLidas.length > 0) {
            badge.style.display = 'flex';
            badge.textContent = naoLidas.length;
          } else {
            badge.style.display = 'none';
          }
        })
        .catch(error => {
          console.error('Erro ao verificar notificações:', error);
          Swal.fire({
            icon: 'error',
            title: 'Erro',
            text: 'Erro ao verificar notificações',
            confirmButtonColor: '#4a6fa5'
          });
        });
    }
    document.addEventListener('DOMContentLoaded', atualizarBadgeNotificacoes);
    setInterval(atualizarBadgeNotificacoes, 30000);
  </script>
</body>
</html>
