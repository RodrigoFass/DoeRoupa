<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Home Principal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- FontAwesome para ícones -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', Arial, sans-serif;
      background: #F0CDC3;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .header {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 36px 0 16px 0;
      width: 100vw;
      box-sizing: border-box;
    }
    .logo {
      width: 240px;
      margin-bottom: 18px;
    }
    .search-bar {
      display: flex;
      align-items: center;
      background: #8c7b75;
      border-radius: 32px;
      padding: 14px 28px;
      width: calc(100% - 32px);
      max-width: 480px;
      margin: 0 auto 28px auto;
      box-shadow: 0 4px 16px rgba(0,0,0,0.10);
      box-sizing: border-box;
      margin-left: 16px;
      margin-right: 16px;
      transition: box-shadow 0.2s;
    }
    .search-bar:focus-within {
      box-shadow: 0 8px 24px rgba(0,0,0,0.13);
    }
    .search-bar i {
      color: #fff;
      font-size: 1.4em;
      margin-right: 14px;
    }
    .search-bar input {
      border: none;
      background: transparent;
      outline: none;
      color: #fff;
      font-size: 1.1em;
      width: 100%;
    }
    .main-content {
      flex: 1;
      padding-bottom: 100px;
      max-width: 540px;
      width: 100vw;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-sizing: border-box;
      padding-left: 12px;
      padding-right: 12px;
    }
    .card {
      background: #fff;
      border-radius: 24px;
      box-shadow: 0 6px 24px rgba(0,0,0,0.10);
      display: flex;
      align-items: center;
      margin: 22px 0;
      padding: 28px 22px;
      gap: 20px;
      position: relative;
      width: 100%;
      max-width: 380px;
      transition: box-shadow 0.2s, transform 0.2s, max-height 0.3s, padding 0.3s;
      overflow: hidden;
      box-sizing: border-box;
      cursor: pointer;
    }
    .card:hover {
      box-shadow: 0 12px 32px rgba(0,0,0,0.13);
      transform: translateY(-2px) scale(1.01);
    }
    .card.expanded {
      max-height: 600px;
      padding-bottom: 32px;
      background: #fffbe9;
      box-shadow: 0 12px 32px rgba(0,0,0,0.13);
    }
    .expand-content {
      margin-top: 18px;
      animation: fadeIn 0.3s;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .avatar {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: linear-gradient(135deg, #f2c6b2 60%, #f8b400 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.3em;
      color: #fff;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
      align-self: center;
    }
    .card-content {
      flex: 1;
      min-width: 0;
    }
    .card-title {
      font-weight: 700;
      font-size: 1.18em;
      color: #3b2e2a;
      margin-bottom: 4px;
      word-break: break-word;
    }
    .card-desc {
      font-size: 1em;
      color: #6d5c57;
      margin-bottom: 6px;
      word-break: break-word;
    }
    .card-actions {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      margin-left: 10px;
      align-self: center;
    }
    .card-actions button {
      background: #f8b400;
      border: none;
      border-radius: 50%;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 1.3em;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
    }
    .card-actions button:hover {
      background: #e09e00;
      transform: scale(1.08);
    }
    .bottom-nav {
      position: fixed;
      left: 0;
      bottom: 0;
      width: 100vw;
      background: #4a6fa5;
      box-shadow: 0 -2px 8px rgba(0,0,0,0.08);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 80px;
      z-index: 100;
    }
    .bottom-nav .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1 1 0;
      height: 100%;
      color: #fff;
      font-size: 2em;
      text-decoration: none;
      font-family: 'Poppins', 'Segoe UI', Arial, sans-serif;
      font-weight: 600;
      transition: color 0.2s;
      padding: 0;
      margin: 0;
    }
    .bottom-nav .nav-item i {
      font-size: 1.5em;
      margin: 0 auto;
      display: block;
    }
    .bottom-nav .nav-item.active,
    .bottom-nav .nav-item:hover {
      color: #f8b400;
    }
    .icon-badge-container {
      position: relative;
      display: inline-block;
    }
    .badge {
      position: absolute;
      top: -6px;
      right: -10px;
      background: #d24540;
      color: #fff;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      font-size: 0.5em;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
      border: 2.5px solid #fff;
      box-shadow: 0 2px 8px rgba(210,69,64,0.18);
      transition: background 0.2s, box-shadow 0.2s;
      letter-spacing: 0;
      padding: 0;
    }
    .roupa-list {
      display: flex;
      flex-direction: column;
      gap: 18px;
      margin-bottom: 24px;
    }
    .roupa-item {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 1.25em;
      font-weight: 700;
      color: #4a6fa5;
    }
    .roupa-item input[type="checkbox"] {
      width: 28px;
      height: 28px;
      accent-color: #4a6fa5;
      border-radius: 8px;
      border: 2px solid #4a6fa5;
      background: #fff;
      margin-right: 8px;
      cursor: pointer;
    }
    .roupa-item label {
      cursor: pointer;
      font-family: inherit;
      font-size: 1.1em;
      font-weight: 700;
      color: #4a6fa5;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .roupa-item .fav {
      color: #f8b400;
      font-size: 1em;
      margin-left: 2px;
    }
    .btn-confirmar {
      background: #e76a5a;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1.25em;
      font-weight: 700;
      padding: 12px 0;
      width: 180px;
      margin: 0 auto;
      display: block;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
      transition: background 0.2s, transform 0.2s;
      cursor: pointer;
    }
    .btn-confirmar:hover {
      background: #d24540;
      transform: scale(1.04);
    }
    .card.expanded .card-actions {
      display: none !important;
    }
    @media (max-width: 600px) {
      html, body { overflow-x: hidden; }
      .main-content {
        padding-bottom: 100px;
        max-width: 100vw;
        padding-left: 2vw;
        padding-right: 2vw;
      }
      .search-bar {
        width: calc(100% - 16px);
        max-width: 100vw;
        margin-left: 8px;
        margin-right: 8px;
      }
      .card {
        max-width: 98vw;
      }
      .header { padding: 18px 0 8px 0; }
      .logo { width: 180px; }
      .bottom-nav { height: 80px; }
    }
    @media (min-width: 900px) {
      .main-content { max-width: 700px; }
      .card { max-width: 600px; }
      .search-bar { max-width: 600px; }
    }
    .btn-flutuante {
      position: fixed;
      bottom: 110px;
      right: 24px;
      background: #e76a5a;
      color: #fff;
      border: none;
      border-radius: 24px;
      font-size: 1.15em;
      font-weight: 700;
      padding: 16px 28px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.13);
      cursor: pointer;
      z-index: 200;
      transition: background 0.2s, transform 0.2s;
    }
    .btn-flutuante:hover {
      background: #d24540;
      transform: scale(1.04);
    }
    .modal-doacao {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.18);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 300;
    }
    .modal-content {
      background: #fffbe9;
      border-radius: 24px;
      padding: 36px 32px 28px 32px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.13);
      min-width: 320px;
      max-width: 90vw;
      position: relative;
      text-align: center;
    }
    .close-modal {
      position: absolute;
      top: 18px;
      right: 24px;
      font-size: 2em;
      color: #e76a5a;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="logo.png" alt="Logo" class="logo">
    <div class="search-bar">
      <i class="fas fa-search"></i>
      <input type="text" id="searchInput" placeholder="Buscar instituições...">
    </div>
  </div>
  <div class="main-content" id="cardsContainer">
    <!-- Cards serão inseridos aqui via JS -->
  </div>
  <button id="btnAnunciarDoacao" class="btn-flutuante">Quero doar roupa</button>
  <div id="modalDoacao" class="modal-doacao" style="display:none;">
    <div class="modal-content">
      <span class="close-modal">&times;</span>
      <h2>O que você quer doar?</h2>
      <form id="formDoacaoLivre" class="roupa-list">
        <div class="roupa-item"><input type="checkbox" id="livre-camisa"><label for="livre-camisa">Camisa</label></div>
        <div class="roupa-item"><input type="checkbox" id="livre-bermuda"><label for="livre-bermuda">Bermuda</label></div>
        <div class="roupa-item"><input type="checkbox" id="livre-calca"><label for="livre-calca">Calça</label></div>
        <div class="roupa-item"><input type="checkbox" id="livre-tenis"><label for="livre-tenis">Tenis</label></div>
        <div class="roupa-item"><input type="checkbox" id="livre-agasalho"><label for="livre-agasalho">Agasalho</label></div>
        <div class="roupa-item"><input type="checkbox" id="livre-meia"><label for="livre-meia">Meia</label></div>
        <button class="btn-confirmar" type="submit">Confirmar</button>
      </form>
    </div>
  </div>
  <nav class="bottom-nav">
    <a href="home.html" class="nav-item active"><i class="fas fa-home"></i></a>
    <a href="notificacoes.html" class="nav-item" id="notificacoesNav">
      <span class="icon-badge-container"><i class="fas fa-bell"></i><span class="badge" id="notificacoesBadge" style="display:none;">●</span></span>
    </a>
    <a href="agenda.html" class="nav-item"><i class="fas fa-calendar-alt"></i></a>
    <a href="chat.html" class="nav-item"><i class="fas fa-comments"></i></a>
    <a href="configuracoes.html" class="nav-item"><i class="fas fa-cog"></i></a>
  </nav>
  <script>
    // Proteção de acesso: só usuário pode acessar
    if (localStorage.getItem('userType') === 'instituicao') {
      window.location.href = '/home_instituicao.html';
    }

    async function carregarCards(filtro = "") {
      const container = document.getElementById('cardsContainer');
      container.innerHTML = '';
      try {
        const resposta = await fetch('/dados');
        const dados = await resposta.json();
        // Mostrar apenas instituições cadastradas
        dados.instituicoes.forEach((inst, idx) => {
          if (filtro && !inst.nome.toLowerCase().includes(filtro.toLowerCase())) return;
          container.innerHTML += `
            <div class="card" data-idx="${idx}">
              <div class="avatar"><i class="fas fa-building"></i></div>
              <div class="card-content">
                <div class="card-title">${inst.nome}</div>
                <div class="card-desc">Endereço: ${inst.endereco}<br>Email: ${inst.email}<br>Telefone: ${inst.telefone}</div>
              </div>
              <div class="card-actions">
                <button title="Ver detalhes"><i class="fas fa-info-circle"></i></button>
              </div>
              <div class="expand-content" style="display:none">
                <div class="roupa-list">
                  <div class="roupa-item"><input type="checkbox" id="camisa-"><label for="camisa-">Camisa</label></div>
                  <div class="roupa-item"><input type="checkbox" id="bermuda-"><label for="bermuda-">Bermuda</label></div>
                  <div class="roupa-item"><input type="checkbox" id="calca-"><label for="calca-">Calça</label></div>
                  <div class="roupa-item"><input type="checkbox" id="tenis-"><label for="tenis-">Tenis</label></div>
                  <div class="roupa-item"><input type="checkbox" id="agasalho-"><label for="agasalho-">Agasalho</label></div>
                  <div class="roupa-item"><input type="checkbox" id="meia-"><label for="meia-">Meia</label></div>
                </div>
                <button class="btn-confirmar" type="button">Confirmar</button>
              </div>
            </div>
          `;
        });
      } catch (error) {
        container.innerHTML = '<p style="text-align:center;color:#c00;">Erro ao carregar dados.</p>';
      }
      // Expansão dos cards
      document.querySelectorAll('.card').forEach(card => {
        card.addEventListener('click', function(e) {
          // Evita expandir ao clicar no botão
          if (e.target.closest('button')) return;
          document.querySelectorAll('.card').forEach(c => {
            c.classList.remove('expanded');
            c.querySelector('.expand-content').style.display = 'none';
          });
          this.classList.add('expanded');
          this.querySelector('.expand-content').style.display = 'block';
        });
        // Botão de detalhes não expande
        card.querySelector('.card-actions button').addEventListener('click', function(e) {
          e.stopPropagation();
        });
      });
      // Adiciona event listener diretamente nos botões .btn-confirmar
      document.querySelectorAll('.btn-confirmar').forEach(btn => {
        btn.addEventListener('click', async function(e) {
          e.stopPropagation();
          const card = btn.closest('.card');
          if (!card) return;
          const idx = card.getAttribute('data-idx');
          const resposta = await fetch('/dados');
          const dados = await resposta.json();
          const inst = dados.instituicoes[idx];
          if (!inst) return;
          // Coleta roupas marcadas
          const roupas = [];
          const checkboxes = card.querySelectorAll('.expand-content input[type="checkbox"]');
          ['Camisa','Bermuda','Calça','Tenis','Agasalho','Meia'].forEach((r, i) => {
            if (checkboxes[i] && checkboxes[i].checked) roupas.push(r);
          });
          if (roupas.length === 0) { 
            Swal.fire({
              icon: 'warning',
              title: 'Atenção',
              text: 'Selecione pelo menos uma opção!',
              confirmButtonColor: '#4a6fa5'
            });
            return; 
          }
          // Pega id do usuário logado
          const usuario_id = localStorage.getItem('userId');
          const instituicao_id = inst.id;
          // 1. Registrar a doação
          const res = await fetch('/doar', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ usuario_id, instituicao_id, roupas })
          });
          if (res.ok) {
            // Buscar ou criar conversa
            const respConversa = await fetch('/criar-conversa', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ usuario_id, instituicao_id })
            });
            const conversa = await respConversa.json();
            // Enviar mensagem automática para a instituição
            const mensagem = `Olá! Gostaria de doar as seguintes roupas: ${roupas.join(', ')}.`;
            await fetch('/mensagem', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ conversa_id: conversa.id, remetente_id: usuario_id, texto: mensagem })
            });
            // Redirecionar para o chat da conversa
            window.location.href = `conversa.html?id=${conversa.id}`;
          } else {
            console.error('Erro ao registrar doação:', error);
            Swal.fire({
              icon: 'error',
              title: 'Erro',
              text: 'Erro ao registrar doação!',
              confirmButtonColor: '#4a6fa5'
            });
          }
        });
      });
    }
    document.getElementById('searchInput').addEventListener('input', function() {
      carregarCards(this.value);
    });
    window.onload = () => carregarCards();
    // Botão flutuante e modal de doação livre
    document.getElementById('btnAnunciarDoacao').onclick = function() {
      document.getElementById('modalDoacao').style.display = 'flex';
    };
    document.querySelector('.close-modal').onclick = function() {
      document.getElementById('modalDoacao').style.display = 'none';
    };
    document.getElementById('formDoacaoLivre').onsubmit = async function(e) {
      e.preventDefault();
      // Coletar roupas marcadas
      const roupas = [];
      ['camisa','bermuda','calca','tenis','agasalho','meia'].forEach(r => {
        if(document.getElementById('livre-'+r).checked) roupas.push(r.charAt(0).toUpperCase()+r.slice(1));
      });
      if(roupas.length === 0) { 
        Swal.fire({
          icon: 'warning',
          title: 'Atenção',
          text: 'Selecione pelo menos uma opção!',
          confirmButtonColor: '#4a6fa5'
        });
        return; 
      }
      // Pega id do usuário logado do localStorage
      let usuario_id = localStorage.getItem('userId');
      if(!usuario_id) { 
        Swal.fire({
          icon: 'warning',
          title: 'Atenção',
          text: 'Faça login para anunciar doação!',
          confirmButtonColor: '#4a6fa5'
        });
        return; 
      }
      const res = await fetch('/doar', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ usuario_id, instituicao_id: null, roupas })
      });
      if(res.ok) {
        // Salvar roupas doadas no localStorage para exibir na home da instituição
        localStorage.setItem('roupas_doacao', JSON.stringify(roupas));
        Swal.fire({
          icon: 'success',
          title: 'Sucesso!',
          text: 'Doação anunciada!',
          confirmButtonColor: '#4a6fa5'
        });
        document.getElementById('modalDoacao').style.display = 'none';
        document.getElementById('formDoacaoLivre').reset();
        // Não redireciona para o chat aqui
      } else {
        console.error('Erro ao anunciar doação:', error);
        Swal.fire({
          icon: 'error',
          title: 'Erro',
          text: 'Erro ao anunciar doação.',
          confirmButtonColor: '#4a6fa5'
        });
      }
    };

    // Função para verificar o tipo de usuário
    async function verificarTipoUsuario() {
      const id = localStorage.getItem('userId');
      if (!id) {
        window.location.href = '/login';
        return;
      }

      try {
        const response = await fetch(`/verificar-tipo?id=${id}`);
        const data = await response.json();
        
        if (!data.tipo) {
          window.location.href = '/login';
          return;
        }

        // Armazena o tipo de usuário no localStorage
        localStorage.setItem('userType', data.tipo);
      } catch (error) {
        console.error('Erro ao verificar tipo de usuário:', error);
        window.location.href = '/login';
      }
    }

    // Verifica o tipo de usuário quando a página carrega
    document.addEventListener('DOMContentLoaded', verificarTipoUsuario);

    // Adiciona evento de clique para o botão home
    document.querySelector('a[href="home.html"]').addEventListener('click', function(e) {
      e.preventDefault();
      const userType = localStorage.getItem('userType');
      if (userType === 'instituicao') {
        window.location.href = '/home_instituicao.html';
      } else {
        window.location.href = '/home.html';
      }
    });

    function atualizarBadgeNotificacoes() {
      const badge = document.getElementById('notificacoesBadge');
      const userId = localStorage.getItem('userId');
      const userType = localStorage.getItem('userType');
      if (!userId || !userType) return;
      fetch(`/notificacoes?id=${userId}&tipo=${userType}`)
        .then(res => res.json())
        .then(notificacoes => {
          const naoLidas = notificacoes.filter(n => !n.lida);
          if (naoLidas.length > 0) {
            badge.style.display = 'flex';
            badge.textContent = naoLidas.length;
          } else {
            badge.style.display = 'none';
          }
        })
        .catch(error => {
          console.error('Erro ao verificar notificações:', error);
        });
    }
    document.addEventListener('DOMContentLoaded', atualizarBadgeNotificacoes);
    // Atualiza o badge a cada 30 segundos
    setInterval(atualizarBadgeNotificacoes, 30000);
  </script>
</body>
</html>
